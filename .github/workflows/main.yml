
name: CI Pipeline

on:
  push:
    branches: ["main"]
env:
  IMAGE_NAME : spring-boot-app

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v6.1.0

      - name: Setup Java JDK
        uses: actions/setup-java@v5.7.0
        with:
          java-version: 21
          distribution: 'temurin'
      - name: Build Project
        run: mvn clean package
      - name: Run Tests
        run: mvn test
      - name: Create docker image
        run: docker build -t ${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:v2 .
      - name: Docker Login
        uses: docker/login-action@v4.6.0
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Upload image in docker hub
        run: docker push ${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:v2
        
      - name: SSH EC2 Server
        uses: cross-the-world/ssh-scp-ssh-pipelines@v1.1.4
        with:
          host: ${{ secrets.SERVER_IP }}
          user: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_KEY }}
          script: |
           docker pull ${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:v2
           docker stop spring-boot-app | true
           docker rm spring-boot-app | true 
           docker run -d -p 8000:8000 --name spring-boot-app ${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:v
