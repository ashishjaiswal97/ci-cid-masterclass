
name: CI Pipeline

on:
  push:
    branches: ["main"]
env:
  IMAGE_NAME : spring-boot-app

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          java-version: '17'

      - name: Build Project
        run: mvn clean package

      - name: Run Tests
        run: mvn test
      - name: Create docker image
        run: docker build -t ${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:v2 .
      - name: Docker Login
        uses: docker/login-action@v4.6.0
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Upload image in docker hub
        run: docer push ${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:v2
        
        
      
